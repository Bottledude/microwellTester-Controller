; Soft-magnetic coil driver — ESP32-WROOM-32 + PCA9685 + BTS7960
;
; Serial Monitor (UART0 USB): 115200 baud
; PCA9685 I2C0: GPIO21 SDA / GPIO22 SCL, addr 0x40. OE to GND.
; 4× MLX90393 I2C1: GPIO18 SDA / GPIO19 SCL (3.3 V), one behind each coil.
; DualSense: Bluetooth Classic (Bluepad32 Arduino core). USB pad host is not available.
;
;   ESP32:  pio run -t upload
;   Web UI: join SoftAP "CoilControl" / "coilcontrol" → http://192.168.4.1/

[platformio]
monitor_dir = monitor

[env:esp32dev]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

; Arduino-ESP32 2.x with Bluepad32 compiled in (not the stock Espressif core).
platform_packages =
  framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip

build_flags =
  -DNUM_COILS=4
  -DPWM_TARGET_HZ=1000U
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_RUNNING_CORE=0
