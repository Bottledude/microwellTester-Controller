; Soft-magnetic coil driver — WeAct Mini STM32H743VIT6 + BTS7960
;
; Serial Monitor (USART1 PA9/PA10): 115200 baud
; ESP32 WiFi bridge (USART3 PD8/PD9): see esp32_bridge/
;
;   STM32:  pio run -t upload
;   ESP32:  pio run -d esp32_bridge -t upload
;   Web UI: join SoftAP "CoilControl" / "coilcontrol" → http://192.168.4.1/

[env:weact_mini_h743vitx]
platform = ststm32
board = weact_mini_h743vitx
framework = stm32cube

monitor_speed = 115200
monitor_filters = direct

build_flags =
  -DH7
  -DUSE_HAL_DRIVER
  -DSTM32H743xx
  -DHSE_VALUE=25000000U
  -DPWM_TARGET_HZ=40000U
  -DNUM_COILS=6
  ; newlib-nano omits %f unless pulled in — required for json/status floats
  -Wl,-u,_printf_float

; Optional USB-UART port for the H743 Serial Monitor
; monitor_port = /dev/ttyACM0
