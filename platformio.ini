; Soft-magnetic coil driver — WeAct Mini STM32H743VIT6 + PCA9685 + BTS7960
;
; Serial Monitor (USART1 PA9/PA10): 115200 baud
; ESP32 WiFi bridge (USART3 PD8/PD9): see esp32_bridge/
; PCA9685 I2C1: PB8 SCL / PB9 SDA, addr 0x40. EN still on STM32 GPIO.
; 4× MLX90393 I2C2: PB10 SCL / PB11 SDA (3.3 V), one behind each coil. Not I2C1.
;
;   STM32:  pio run -t upload
;   ESP32:  pio run -d esp32_bridge -t upload
;   Web UI: join SoftAP "CoilControl" / "coilcontrol" → http://192.168.4.1/

[platformio]
monitor_dir = monitor

[env:weact_mini_h743vitx]
platform = ststm32
board = weact_mini_h743vitx
framework = stm32cube

monitor_speed = 115200
monitor_filters = debuglog

build_flags =
  -DH7
  -DUSE_HAL_DRIVER
  -DSTM32H743xx
  -DHSE_VALUE=25000000U
  -DPWM_TARGET_HZ=1000U
  -DNUM_COILS=4
  ; newlib-nano omits %f unless pulled in — required for json/status floats
  -Wl,-u,_printf_float

; Optional USB-UART port for the H743 Serial Monitor
; monitor_port = /dev/ttyACM0
